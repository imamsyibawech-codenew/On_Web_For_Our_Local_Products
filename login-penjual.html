<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Penjual — Lokalmart</title>
  <link rel="icon" href="assets/logo-lokalmart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header scrolled">
    <nav class="nav container">
      <a href="index.html" class="logo" aria-label="Lokalmart — Beranda">
        <img src="assets/logo-lokalmart.svg" alt="" class="logo-img" width="42" height="42" decoding="async">
        <span class="logo-text">Lokalmart</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Buka menu"><span></span><span></span><span></span></button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">Beranda</a></li>
        <li><a href="index.html#produk" class="nav-link">Produk</a></li>
        <li><a href="keranjang.html" class="nav-link">Keranjang</a></li>
        <li><a href="daftar-umkm.html" class="nav-link">Daftar UMKM</a></li>
      </ul>
      <div class="nav-actions">
        <a href="keranjang.html" class="btn-icon cart-btn" aria-label="Keranjang">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cartCount" hidden>0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="page-main">
    <section class="auth-section">
      <div class="container auth-container" data-animate>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Masuk</button>
          <button class="auth-tab" data-tab="register">Daftar Penjual</button>
        </div>

        <!-- Login -->
        <form class="auth-form" id="loginForm">
          <h1>Selamat Datang Kembali</h1>
          <p class="auth-subtitle">Kelola produk UMKM Anda di dashboard penjual</p>

          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required placeholder="email@usahaanda.com">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="Min. 6 karakter" minlength="6">
          </div>

          <div class="demo-hint">
            <strong>Akun demo:</strong> demo@lokalmart.id / demo123
          </div>

          <div class="form-errors" id="loginErrors" hidden></div>
          <button type="submit" class="btn btn-primary btn-lg btn-full" id="loginBtn">Masuk</button>
        </form>

        <!-- Register -->
        <form class="auth-form" id="registerForm" hidden>
          <h1>Daftar Akun Penjual</h1>
          <p class="auth-subtitle">Buat akun untuk mengelola dan upload produk lokal Anda</p>

          <div class="form-grid">
            <div class="form-group">
              <label for="regNamaUsaha">Nama Usaha <span class="required">*</span></label>
              <input type="text" id="regNamaUsaha" required>
            </div>
            <div class="form-group">
              <label for="regNamaPemilik">Nama Pemilik <span class="required">*</span></label>
              <input type="text" id="regNamaPemilik" required>
            </div>
            <div class="form-group">
              <label for="regEmail">Email <span class="required">*</span></label>
              <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
              <label for="regPassword">Password <span class="required">*</span></label>
              <input type="password" id="regPassword" required minlength="6">
            </div>
            <div class="form-group">
              <label for="regTelepon">Telepon <span class="required">*</span></label>
              <input type="tel" id="regTelepon" required>
            </div>
            <div class="form-group">
              <label for="regKategori">Kategori <span class="required">*</span></label>
              <select id="regKategori" required>
                <option value="">Pilih kategori</option>
                <option value="kerajinan">Kerajinan Khas</option>
                <option value="makanan">Makanan Khas</option>
                <option value="pertanian">Hasil Pertanian</option>
                <option value="perikanan">Perikanan</option>
              </select>
            </div>
            <div class="form-group">
              <label for="regProvinsi">Provinsi <span class="required">*</span></label>
              <input type="text" id="regProvinsi" required>
            </div>
            <div class="form-group">
              <label for="regKota">Kota <span class="required">*</span></label>
              <input type="text" id="regKota" required>
            </div>
          </div>

          <div class="form-errors" id="registerErrors" hidden></div>
          <button type="submit" class="btn btn-primary btn-lg btn-full" id="registerBtn">Buat Akun Penjual</button>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart-ui.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login-penjual.js"></script>
</body>
</html>
